<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Gestão de documentos - Banco Senai</title>
    <link rel="stylesheet" href="documento.css" />
</head>

<body>
    <h1>Gestão de Documentos</h1>

    <div class="form-container">
        <input type="number" id="codigoCliente" placeholder="Código do cliente" />
        <!-- Corrigido: removido o espaço no id -->
        <input type="file" id="arquivo" />
        <button class="btn" onclick="enviarDocumento()">Enviar</button>
    </div>

    <div class="card">
        <h2>Consultar Documentos</h2>
        <div class="form-group">
            <input type="number" id="codigoClienteBusca" placeholder="Código do cliente" />
            <button class="btn" onclick="listarDocumentos()">Buscar Documentos</button>
        </div><br />
        <div class="table">
            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Extensão</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaDocumentos">
                </tbody>
            </table>
        </div>
    </div>
    <script src="documento.js"></script>
</body>
</html>
